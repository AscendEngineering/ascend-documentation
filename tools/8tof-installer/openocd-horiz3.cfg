# Ascend horizontal v3 / STM32H563 / ST-Link SWD. No NRST wire on this board.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
if {[info exists ASCEND_STLINK_SERIAL]} { adapter serial $ASCEND_STLINK_SERIAL }
set AP_NUM 0
source [find target/stm32h5x.cfg]
# Compatibility with ST OpenOCD builds that removed target mem2array.
proc stm32h5x_mrw {used_target reg} {
    return [lindex [$used_target read_memory $reg 32 1] 0]
}
reset_config none connect_deassert_srst
adapter speed 480
gdb_port disabled
tcl_port disabled
telnet_port disabled
